services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: boundbybooks
      POSTGRES_USER: boundbybooks
      POSTGRES_PASSWORD: boundbybooks
    ports:
      - "5432:5432"
    volumes:
      - boundbybooks_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boundbybooks -d boundbybooks"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  boundbybooks_postgres:
